name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and run available tests
        run: mvn --batch-mode --no-transfer-progress --update-snapshots clean verify
      - name: Prepare plugin and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t jars < <(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one packaged plugin JAR; found ${#jars[@]}" >&2
            exit 1
          fi
          jar tf "${jars[0]}" | grep -qx 'plugin.yml'
          cp "${jars[0]}" dist/SkillsMC.jar
          cd dist
          sha256sum SkillsMC.jar > SkillsMC.jar.sha256
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: SkillsMC-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SkillsMC-${{ github.sha }}
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/SkillsMC.jar dist/SkillsMC.jar.sha256 --verify-tag --title "$RELEASE_TAG" --generate-notes
